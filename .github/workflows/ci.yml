name: CI

# Every gate is blocking: a failing step fails the run, and a red run blocks merge once branch protection requires
# these two jobs. No step may use continue-on-error. The same gates run without GitHub Actions: `bash ci/gates.sh`.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned so a new clippy release cannot turn the gate red without a code change; bump deliberately.
      - name: Rust toolchain 1.90.0 (+ clippy, rustfmt)
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Format (rustfmt, whole workspace)
        run: cargo fmt --all --check

      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release --workspace

      - name: Test (the integer-vs-float verify gates + unit tests + seam doctests)
        run: cargo test --workspace --release

      # Records which CPU kernel variants this runner's silicon executed (avx2 / avx512 when present) and fails if any
      # of them returns a byte different from the portable kernel.
      - name: Runtime probe (every CPU variant on this runner, byte-identical)
        run: cargo run --release -p kt-runtime --example runtime_probe

      - name: API docs (rustdoc, warnings are errors)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  secret-scan:
    name: secret-scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
